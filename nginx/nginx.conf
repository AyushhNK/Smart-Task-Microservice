worker_processes auto;

events {
    worker_connections 1024;
}

http {

    # ----------------------------
    # Rate limit zones
    # ----------------------------

    # General API rate limit (per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Auth service stricter limit
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # ----------------------------
    # Upstream (Load Balancers)
    # ----------------------------

    upstream auth_service {
        least_conn;
        server auth_service_1:8000;
        server auth_service_2:8000;
    }

    upstream task_service {
        least_conn;
        server task_service_1:8000;
        server task_service_2:8000;
    }

    # ----------------------------
    # Server
    # ----------------------------

    server {
        listen 80;
        server_name _;

        # ----------------------------
        # AUTH SERVICE
        # ----------------------------
        location /auth/ {

            # Rate limiting (STRICT)
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://auth_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ----------------------------
        # TASK SERVICE
        # ----------------------------
        location /tasks/ {

            # Rate limiting (GENERAL)
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://task_service;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # ----------------------------
        # Health Check
        # ----------------------------
        location /health/ {
            access_log off;
            return 200 "OK";
        }
    }
}
